name: Build KolourPaint (Windows)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest
  
    defaults:
      run:
        shell: msys2 {0}
  
    steps:
      - name: Check out source
        uses: actions/checkout@v4
    
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-kconfig
            mingw-w64-ucrt-x86_64-kcoreaddons
            mingw-w64-ucrt-x86_64-kcrash
            mingw-w64-ucrt-x86_64-kguiaddons
            mingw-w64-ucrt-x86_64-ki18n
            mingw-w64-ucrt-x86_64-kiconthemes
            mingw-w64-ucrt-x86_64-ktextwidgets
            mingw-w64-ucrt-x86_64-kwidgetsaddons
            mingw-w64-ucrt-x86_64-kxmlgui
            mingw-w64-ucrt-x86_64-kio
            mingw-w64-ucrt-x86_64-kdoctools

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"
          -DCMAKE_PREFIX_PATH=/ucrt64
    
      - name: Build
        run: cmake --build build --parallel
    
      - name: Install
        run: cmake --install build
    
      - name: Deploy Qt
        run: |
          windeployqt6 \
            --release \
            --no-translations \
            "$GITHUB_WORKSPACE/install/bin/kolourpaint.exe"
    
      - name: Deploy MSYS2 runtime
        run: |
          mkdir -p "$GITHUB_WORKSPACE/install/bin"
    
          # MinGW runtime
          cp /ucrt64/bin/libgcc_s_seh-1.dll "$GITHUB_WORKSPACE/install/bin/"
          cp /ucrt64/bin/libstdc++-6.dll "$GITHUB_WORKSPACE/install/bin/"
          cp /ucrt64/bin/libwinpthread-1.dll "$GITHUB_WORKSPACE/install/bin/"
    
          # KDE Frameworks
          cp /ucrt64/bin/libKF6*.dll "$GITHUB_WORKSPACE/install/bin/"
    
      - name: Upload installed files
        uses: actions/upload-artifact@v4
        with:
          name: kolourpaint-windows-ucrt64
          path: install/
          if-no-files-found: error
