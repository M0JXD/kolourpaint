name: Build KolourPaint (Windows)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest
  
    defaults:
      run:
        shell: msys2 {0}
  
    steps:
      - name: Check out source
        uses: actions/checkout@v4
    
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-kconfig
            mingw-w64-ucrt-x86_64-kcoreaddons
            mingw-w64-ucrt-x86_64-kcrash
            mingw-w64-ucrt-x86_64-kguiaddons
            mingw-w64-ucrt-x86_64-ki18n
            mingw-w64-ucrt-x86_64-kiconthemes
            mingw-w64-ucrt-x86_64-ktextwidgets
            mingw-w64-ucrt-x86_64-kwidgetsaddons
            mingw-w64-ucrt-x86_64-kxmlgui
            mingw-w64-ucrt-x86_64-kio
            mingw-w64-ucrt-x86_64-kdoctools
            mingw-w64-ucrt-x86_64-icoutils

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"
          -DCMAKE_PREFIX_PATH=/ucrt64
    
      - name: Build
        run: cmake --build build --parallel
    
      - name: Install
        run: cmake --install build

      - name: Analyse runtime dependencies
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/install/bin"

          echo "=== KolourPaint direct dependencies ==="
          ldd kolourpaint.exe || true

          echo
          echo "=== All bundled DLLs ==="
          find . -type f -iname '*.dll' -printf '%f\n' | sort

          echo
          echo "=== DLL dependency tree ==="
          for dll in *.dll; do
            echo "--- $dll ---"
            ldd "$dll" 2>/dev/null | grep '/ucrt64/bin/' || true
          done
    
      - name: Deploy Qt
        run: |
          windeployqt6 \
            --release \
            --no-translations \
            "$GITHUB_WORKSPACE/install/bin/kolourpaint.exe"

      - name: Deploy required MSYS2 runtime DLLs
        run: |
          set -e

          BIN="$GITHUB_WORKSPACE/install/bin"

          # Queue all executables and DLLs currently deployed by CMake/windeployqt.
          find "$BIN" -type f \( -iname '*.exe' -o -iname '*.dll' \) \
            > /tmp/queue.txt

          > /tmp/processed.txt

          while IFS= read -r file; do
            [ -f "$file" ] || continue

            if grep -Fxq "$file" /tmp/processed.txt; then
              continue
            fi

            echo "$file" >> /tmp/processed.txt
            echo "Scanning $(basename "$file")"

            deps=$(
              ldd "$file" 2>/dev/null |
              sed -n 's/.*=> \(\/ucrt64\/bin\/[^ ]*\.dll\).*/\1/p'
            )

            while IFS= read -r dep; do
              [ -f "$dep" ] || continue

              name="$(basename "$dep")"

              if [ ! -f "$BIN/$name" ]; then
                echo "  Copying $name"
                cp "$dep" "$BIN/$name"
              fi

              if ! grep -Fxq "$BIN/$name" /tmp/processed.txt &&
                 ! grep -Fxq "$BIN/$name" /tmp/queue.txt; then
                echo "$BIN/$name" >> /tmp/queue.txt
              fi
            done <<< "$deps"

          done < <(tail -f /tmp/queue.txt)

      - name: Remove development files
        run: |
          rm -rf "$GITHUB_WORKSPACE/install/lib"
    
      - name: Upload installed files
        uses: actions/upload-artifact@v4
        with:
          name: kolourpaint-windows-ucrt64
          path: install/
          if-no-files-found: error
