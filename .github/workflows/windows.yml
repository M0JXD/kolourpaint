name: Build KolourPaint (Windows)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest
  
    defaults:
      run:
        shell: msys2 {0}
  
    steps:
      - name: Check out source
        uses: actions/checkout@v4
    
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-kconfig
            mingw-w64-ucrt-x86_64-kcoreaddons
            mingw-w64-ucrt-x86_64-kcrash
            mingw-w64-ucrt-x86_64-kguiaddons
            mingw-w64-ucrt-x86_64-ki18n
            mingw-w64-ucrt-x86_64-kiconthemes
            mingw-w64-ucrt-x86_64-ktextwidgets
            mingw-w64-ucrt-x86_64-kwidgetsaddons
            mingw-w64-ucrt-x86_64-kxmlgui
            mingw-w64-ucrt-x86_64-kio
            mingw-w64-ucrt-x86_64-kdoctools
            mingw-w64-ucrt-x86_64-icoutils

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"
          -DCMAKE_PREFIX_PATH=/ucrt64
    
      - name: Build
        run: cmake --build build --parallel
    
      - name: Install
        run: cmake --install build

      - name: Deploy Qt
        run: |
          windeployqt6 \
            --release \
            --no-translations \
            "$GITHUB_WORKSPACE/install/bin/kolourpaint.exe"

      - name: Deploy required MSYS2 runtime DLLs
        run: |
          set -e

          BIN="$GITHUB_WORKSPACE/install/bin"
          QUEUE="/tmp/kolourpaint-dependency-queue.txt"
          PROCESSED="/tmp/kolourpaint-dependency-processed.txt"

          find "$BIN" -type f \( -iname '*.exe' -o -iname '*.dll' \) \
            > "$QUEUE"

          : > "$PROCESSED"

          INDEX=1

          while true; do
            TOTAL=$(wc -l < "$QUEUE")

            if [ "$INDEX" -gt "$TOTAL" ]; then
              break
            fi

            FILE=$(sed -n "${INDEX}p" "$QUEUE")
            INDEX=$((INDEX + 1))

            [ -f "$FILE" ] || continue

            if grep -Fxq "$FILE" "$PROCESSED"; then
              continue
            fi

            echo "$FILE" >> "$PROCESSED"
            echo "Scanning $(basename "$FILE")"

            while IFS= read -r DEP; do
              [ -f "$DEP" ] || continue

              NAME="$(basename "$DEP")"
              DEST="$BIN/$NAME"

              if [ ! -f "$DEST" ]; then
                echo "  Copying $NAME"
                cp "$DEP" "$DEST"
              fi

              if ! grep -Fxq "$DEST" "$PROCESSED" &&
                 ! grep -Fxq "$DEST" "$QUEUE"; then
                echo "$DEST" >> "$QUEUE"
              fi

            done < <(
              ldd "$FILE" 2>/dev/null |
              sed -n 's/.*=> \(\/ucrt64\/bin\/[^ ]*\.dll\).*/\1/p'
            )
          done

      - name: Remove development files
        run: |
          rm -rf "$GITHUB_WORKSPACE/install/lib"

      - name: Upload installed files
        uses: actions/upload-artifact@v4
        with:
          name: kolourpaint-windows-ucrt64
          path: install/
          if-no-files-found: error
